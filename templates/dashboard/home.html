{% extends "dashboard/base.html" %}

{% block title %}Overview{% endblock %}
{% block page_title %}Overview{% endblock %}

{% block content %}
<div class="db-page-header">
  <h2>Welcome back, {{ request.user.username }}</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
  {% for card in cards %}
  <a href="{% url 'dashboard_model_list' model_slug=card.slug %}" class="db-card" style="text-decoration: none; color: inherit;">
    <div style="font-size: 13px; color: var(--db-muted); text-transform: uppercase; margin-bottom: 8px;">{{ card.config.label }}</div>
    <div style="font-size: 28px; font-weight: 700;">{{ card.count }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
