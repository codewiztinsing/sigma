<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Login — Sigma EcoBuild</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10241e;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .login-card {
    width: 340px;
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .login-brand { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #10241e; }
  .login-brand span { color: #1f8a5f; }
  .login-sub { font-size: 13px; color: #6b7a75; margin-bottom: 24px; }
  .login-group { margin-bottom: 16px; }
  .login-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .login-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e6ea;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  .login-btn {
    width: 100%;
    padding: 11px;
    background: #1f8a5f;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-btn:hover { background: #176b48; }
  .login-error {
    background: #fdecea;
    color: #b3261e;
    border: 1px solid #f5c2be;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">SIGMA<span>.</span> Dashboard</div>
    <div class="login-sub">Staff sign-in required to manage site content.</div>
    {% if error %}
    <div class="login-error"><i class="fas fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="login-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="login-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Log In</button>
    </form>
  </div>
</body>
</html>
